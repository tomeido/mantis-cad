version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      rust-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    # These API migrations need coordinated native/web changes. Cargo treats
    # 0.x minor-line changes as major updates. Type-only ignores keep security
    # updates eligible; do not replace them with ignored version ranges.
    # See docs/DEPENDENCY_UPDATES.md for the deferred work and validation.
    ignore:
      - dependency-name: eframe
        update-types: ["version-update:semver-major"]
      - dependency-name: egui
        update-types: ["version-update:semver-major"]
      - dependency-name: egui_glow
        update-types: ["version-update:semver-major"]
      - dependency-name: glow
        update-types: ["version-update:semver-major"]
      - dependency-name: argon2
        update-types: ["version-update:semver-major"]
      - dependency-name: quick-xml
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-images:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
