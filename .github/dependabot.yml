version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      rust-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    # Breaking API migrations need explicit native/web compatibility work.
    # Cargo treats 0.x minor-line changes as major updates. Type-only ignores
    # keep security updates eligible; do not use ignored version ranges.
    # See docs/DEPENDENCY_UPDATES.md for examples and migration checks.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-images:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
