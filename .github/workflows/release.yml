name: Native release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: 0.21.14

jobs:
  verify:
    name: Verify source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Match tag to workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          expected_tag="v${workspace_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: [verify, verify-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - name: macOS Intel
            runner: macos-26-intel
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - name: macOS Apple Silicon
            runner: macos-26
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up packaging Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Activate Rust target
        shell: bash
        run: |
          rustup target add "${{ matrix.target }}"
          rustup show active-toolchain

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build desktop installers and optional tools
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          MANTIS_GIT_SHA: ${{ github.sha }}
        run: python packaging/package.py --target "${{ matrix.target }}" --with-tools

      - name: Verify Linux installation and removal
        if: runner.os == 'Linux'
        shell: bash
        run: python3 packaging/smoke.py dist-downloads

      - name: Upload packaged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantis-cad-${{ matrix.artifact }}
          path: dist-downloads/*
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Optional CAD compatibility addons
    needs: [verify, verify-tag]
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up packaging Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build pinned optional runtime addons
        run: python interop/build_addon.py
      - name: Exercise actual packaged Windows runtimes
        run: python interop/smoke_addon.py dist-downloads
      - name: Upload optional addons
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantis-cad-compatibility
          path: dist-downloads/*
          if-no-files-found: error
          retention-days: 14

  grasshopper:
    name: Grasshopper archive addon (${{ matrix.platform }})
    needs: [verify, verify-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            rid: linux-x64
            executable: mantis-gh-io
          - platform: windows
            runner: windows-2025
            rid: win-x64
            executable: mantis-gh-io.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up packaging Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.424"

      - name: Stage Linux thumbnail libraries and notices
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdiplus
          mkdir -p "$RUNNER_TEMP/gh-debs" "$RUNNER_TEMP/gh-linux-libs"
          cd "$RUNNER_TEMP/gh-debs"
          apt-get download libgdiplus libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libpangoft2-1.0-0 libharfbuzz0b libgif7 libexif12 libfribidi0 \
            libthai0 libdatrie1 libpixman-1-0 libxcb-render0 libxcb-shm0 \
            libgraphite2-3 libxrender1 libxext6
          for package in ./*.deb; do
            dpkg-deb --extract "$package" "$RUNNER_TEMP/gh-linux-libs"
          done

      - name: Build standalone GH archive converter
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            python interop/grasshopper/build.py --rid "${{ matrix.rid }}" \
              --output build/grasshopper-helper --linux-libs "$RUNNER_TEMP/gh-linux-libs"
          else
            python interop/grasshopper/build.py --rid "${{ matrix.rid }}" \
              --output build/grasshopper-helper
          fi

      - name: Exercise native GH binary codec
        shell: bash
        run: |
          python interop/grasshopper/test_converter.py \
            --helper "build/grasshopper-helper/${{ matrix.executable }}" \
            --ghx crates/mantis-app/tests/fixtures/grasshopper/mcneel_sliders_series.ghx

      - name: Verify Linux installer ownership and preservation
        if: runner.os == 'Linux'
        run: python interop/grasshopper/test_installer.py

      - name: Package GH archive addon
        run: python interop/grasshopper/package.py --published build/grasshopper-helper --platform ${{ matrix.platform }}

      - name: Upload GH archive addon
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantis-cad-grasshopper-${{ matrix.platform }}
          path: dist-downloads/*
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web bundle
    needs: [verify, verify-tag]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Cargo and Trunk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/trunk
            target
          key: release-web-${{ env.TRUNK_VERSION }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install Trunk
        run: |
          if ! command -v trunk >/dev/null || [ "$(trunk --version | awk '{print $2}')" != "$TRUNK_VERSION" ]; then
            cargo install --locked --version "$TRUNK_VERSION" trunk
          fi

      - name: Build and package web application
        working-directory: crates/mantis-app
        run: |
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("../../Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          package="mantis-cad-v${workspace_version}-web"
          output="${GITHUB_WORKSPACE}/package/${package}"
          trunk build index.html --release --locked --dist "${output}" --public-url /
          cp "${GITHUB_WORKSPACE}/LICENSE" "${output}/"
          cp "${GITHUB_WORKSPACE}/crates/mantis-kernel/THIRD_PARTY_LICENSES.md" "${output}/"
          tar -C "${GITHUB_WORKSPACE}/package" -czf "${GITHUB_WORKSPACE}/${package}.tar.gz" "${package}"

      - name: Upload web bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mantis-cad-web
          path: mantis-cad-*-web.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish checksummed GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, web, compatibility, grasshopper]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mantis-cad-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum mantis-cad* > SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          elif [[ "$tag" == v0.* ]]; then
            gh release create "$tag" release/* --verify-tag --generate-notes --prerelease
          else
            gh release create "$tag" release/* --verify-tag --generate-notes
          fi
